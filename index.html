
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAB UserScript</title>
<style>
*{box-sizing:border-box}
body{
margin:0;padding:30px 15px;min-height:100vh;
display:grid;place-items:center;
background:linear-gradient(135deg,#e8f5ed,#fff);
font-family:Tahoma,Arial,sans-serif;color:#16452f
}
main{
width:100%;max-width:600px;background:white;
padding:30px;border-radius:20px;text-align:center;
box-shadow:0 10px 40px #0001
}
h1{color:#087443}
p{line-height:2;color:#64748b}
.badge{
display:inline-block;background:#e8f5ed;color:#087443;
padding:9px 18px;border-radius:30px;margin:12px
}
a{
display:block;text-decoration:none;padding:16px;
margin:14px 0;border-radius:12px;font-weight:bold
}
.install{background:#087443;color:white}
.github{border:1px solid #ddd;color:#16452f}
.info{
background:#fff8e8;padding:15px;border-radius:12px;
text-align:right;line-height:2;font-size:14px
}
</style>
</head>
<body>
<main>
<h1>🌸 MAB UserScript 🌸</h1>
<p>Collection Form - Auto Print & Return to Box Open</p>
<div class="badge">Tampermonkey + Violentmonkey</div>

<a class="install"
href="https://raw.githubusercontent.com/rahataliattari/mab.user.js/main/mab.user.js">
اسکرپٹ انسٹال / اپڈیٹ کریں
</a>

<a class="github"
href="https://github.com/rahataliattari/mab.user.js">
GitHub Repository
</a>

<div class="info">
<strong>انسٹال کرنے کا طریقہ:</strong><br>
1۔ Tampermonkey یا Violentmonkey فعال کریں۔<br>
2۔ سبز بٹن پر کلک کریں۔<br>
3۔ Install یا Confirm منتخب کریں۔<br>
4۔ MAB ویب سائٹ ریفریش کریں۔
</div>
</main>
</body>
</html>
